<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SalesOS Lite</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════
     SalesOS Lite Design System v3.0 — 3A Grade
     Vercel shadow-as-border + Linear precision + Intercom warmth
     ═══════════════════════════════════════════════ */
  :root {
    --bg-root: #fafafa; --bg-surface: #ffffff; --bg-subtle: #f5f5f5;
    --bg-hover: rgba(0,0,0,0.03); --bg-active: rgba(0,0,0,0.05);
    --text-primary: #171717; --text-secondary: #4d4d4d;
    --text-tertiary: #808080; --text-quaternary: #a3a3a3; --text-disabled: #d4d4d4;
    --accent: #6c5ce7; --accent-hover: #5a4bd1; --accent-soft: rgba(108,92,231,0.06); --accent-text: #6c5ce7;
    --whatsapp: #25D366; --email: #5B9CF5; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    --shadow-border: 0 0 0 1px rgba(0,0,0,0.06);
    --shadow-card: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-elevated: 0 0 0 1px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.06), 0 0 0 1px #fafafa inset;
    --shadow-focus: 0 0 0 2px rgba(108,92,231,0.4);
    --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
    --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-pill:9999px;
    --font-sans:'Geist',system-ui,-apple-system,sans-serif;
    --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,monospace;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
    --duration-fast:150ms;--duration-normal:200ms;--duration-slow:300ms;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-root);color:var(--text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:'liga' 1}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

  /* ── Layout ── */
  #app{display:flex;height:100vh;overflow:hidden}
  .hidden{display:none!important}

  /* ── Login ── */
  #login-overlay{position:fixed;inset:0;background:var(--bg-root);display:flex;align-items:center;justify-content:center;z-index:100}
  #login-box{width:380px;padding:40px 36px;background:var(--bg-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-elevated)}
  #login-box h1{font-size:22px;font-weight:600;letter-spacing:-0.44px;color:var(--text-primary);margin-bottom:6px}
  #login-box .login-sub{font-size:13px;color:var(--text-tertiary);margin-bottom:28px}
  #login-box input{width:100%;padding:11px 14px;margin-bottom:10px;background:var(--bg-subtle);border:none;border-radius:var(--radius-md);font-size:13px;font-family:var(--font-sans);color:var(--text-primary);outline:none;transition:all var(--duration-fast) var(--ease-out);box-shadow:0 0 0 0px transparent}
  #login-box input::placeholder{color:var(--text-quaternary)}
  #login-box input:focus{background:var(--bg-surface);box-shadow:var(--shadow-focus)}
  #login-box .btn-login{width:100%;padding:11px;margin-top:4px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);font-size:13px;font-weight:500;font-family:var(--font-sans);cursor:pointer;transition:all var(--duration-fast) var(--ease-out);box-shadow:0 2px 8px rgba(108,92,231,0.2)}
  #login-box .btn-login:hover{background:var(--accent-hover);transform:scale(1.02);box-shadow:0 4px 12px rgba(108,92,231,0.3)}
  #login-box .btn-login:active{transform:scale(0.98)}
  #login-error{color:var(--danger);font-size:12px;margin-top:8px;display:none}
  .login-hint{font-size:11px;color:var(--text-quaternary);margin-top:20px;text-align:center;line-height:1.6}

  /* ── Nav ── */
  #nav{width:52px;background:var(--bg-surface);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:18px;box-shadow:var(--shadow-border);position:relative;z-index:2}
  .nav-icon{width:34px;height:34px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;transition:all var(--duration-fast) var(--ease-out);cursor:pointer;color:var(--text-tertiary);position:relative}
  .nav-icon:hover{background:var(--bg-hover);color:var(--text-secondary)}
  .nav-icon.active{background:var(--accent-soft);color:var(--accent)}
  .nav-icon.active::after{content:'';position:absolute;left:-16px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
  .nav-brand{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6c5ce7,#8b7cf0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(108,92,231,0.25);cursor:pointer;transition:transform var(--duration-fast) var(--ease-out)}
  .nav-brand:hover{transform:scale(1.05)}
  .nav-logout{font-size:10px;color:var(--text-quaternary);cursor:pointer;padding:4px;transition:color var(--duration-fast)}
  .nav-logout:hover{color:var(--danger)}

  /* ── Sidebar ── */
  #sidebar{width:280px;background:var(--bg-surface);display:flex;flex-direction:column;box-shadow:var(--shadow-border);position:relative;z-index:1}
  #sidebar-header{padding:20px 16px 12px;flex-shrink:0}
  #sidebar-header h1{font-size:18px;font-weight:600;letter-spacing:-0.36px;margin-bottom:14px}
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-quaternary);transition:color var(--duration-fast)}
  .search-wrap:focus-within svg{color:var(--accent)}
  .search-input{width:100%;padding:9px 12px 9px 34px;background:var(--bg-subtle);border:none;border-radius:var(--radius-md);font-size:13px;font-family:var(--font-sans);color:var(--text-primary);outline:none;transition:all var(--duration-fast)}
  .search-input::placeholder{color:var(--text-quaternary)}
  .search-input:focus{background:var(--bg-surface);box-shadow:var(--shadow-focus)}
  .filter-tabs{display:flex;gap:6px;overflow-x:auto}
  .filter-tab{padding:5px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-tertiary);font-family:var(--font-sans);transition:all var(--duration-fast);white-space:nowrap}
  .filter-tab:hover{background:var(--bg-hover);color:var(--text-secondary)}
  .filter-tab.active{background:var(--text-primary);color:#fff}
  #lead-list{flex:1;overflow-y:auto;padding:4px 8px}
  .lead-item{padding:12px;border-radius:var(--radius-lg);cursor:pointer;transition:all var(--duration-fast);position:relative;margin-bottom:1px}
  .lead-item:hover{background:var(--bg-hover)}
  .lead-item:active{background:var(--bg-active);transform:scale(0.995)}
  .lead-item.active{background:var(--accent-soft)}
  .lead-item.active::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
  .lead-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
  .lead-avatar-group{display:flex;align-items:center;gap:10px}
  .lead-avatar{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;flex-shrink:0}
  .lead-avatar.wa{background:linear-gradient(135deg,#25D366,#4ade80)}
  .lead-avatar.em{background:linear-gradient(135deg,#5B9CF5,#84b2f8)}
  .lead-avatar.web{background:linear-gradient(135deg,#a3a3a3,#d4d4d4)}
  .lead-name{font-weight:500;font-size:13px;color:var(--text-primary);letter-spacing:-0.13px}
  .lead-channel-row{display:flex;align-items:center;gap:5px}
  .channel-dot{width:14px;height:14px;flex-shrink:0}
  .ch-label{font-size:11px;font-weight:500}
  .ch-label.wa{color:var(--whatsapp)}.ch-label.em{color:var(--email)}.ch-label.web{color:var(--text-quaternary)}
  .lead-time{font-size:11px;color:var(--text-quaternary);font-feature-settings:'tnum' 1}
  .lead-preview{font-size:12px;color:var(--text-tertiary);padding-left:44px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lead-empty{padding:32px 16px;text-align:center;color:var(--text-quaternary);font-size:13px}

  /* ── Main ── */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-root)}
  #chat-header{padding:14px 32px;background:var(--bg-surface);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-border);z-index:1;min-height:60px}
  .chat-header-left{display:flex;align-items:center;gap:12px}
  .chat-avatar{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6c5ce7,#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;box-shadow:0 2px 8px rgba(108,92,231,0.2);flex-shrink:0}
  .chat-title{font-weight:600;font-size:15px;letter-spacing:-0.2px}
  .chat-subtitle{font-size:12px;color:var(--text-tertiary);margin-top:1px}
  #chat-header-right{display:flex;align-items:center;gap:14px}
  .mode-switch{display:flex;background:var(--bg-subtle);border-radius:var(--radius-md);padding:2px}
  .mode-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-tertiary);font-family:var(--font-sans);transition:all var(--duration-fast)}
  .mode-btn:hover{color:var(--text-secondary)}
  .mode-btn.active{background:var(--bg-surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,0.06)}
  #chat-body{flex:1;display:flex;overflow:hidden}
  #messages-wrap{flex:1;padding:32px 48px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;min-width:0}
  .msg-row{max-width:55%}.msg-row.in{align-self:flex-start}.msg-row.out{align-self:flex-end}
  .msg-bubble{padding:14px 20px;border-radius:var(--radius-xl);font-size:13px;line-height:1.65}
  .msg-row.in .msg-bubble{background:var(--bg-surface);box-shadow:var(--shadow-card);border-bottom-left-radius:6px}
  .msg-row.out .msg-bubble{background:var(--accent-soft);border-bottom-right-radius:6px}
  .time-divider{text-align:center;margin:4px 0}
  .time-divider span{font-size:11px;color:var(--text-quaternary);font-feature-settings:'tnum' 1}
  .mode-banner{align-self:center;padding:7px 16px;border-radius:var(--radius-pill);font-size:11px;color:var(--accent-text);background:var(--accent-soft);font-weight:500}
  .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-quaternary);font-size:14px}
  #reply-area{padding:18px 48px 22px;background:var(--bg-surface);box-shadow:0 -1px 0 0 rgba(0,0,0,0.06)}
  #reply-row{display:flex;gap:12px;align-items:flex-end}
  #reply-input{flex:1;min-height:46px;max-height:120px;border:none;background:var(--bg-subtle);border-radius:14px;padding:13px 18px;font-size:13px;font-family:var(--font-sans);color:var(--text-primary);outline:none;resize:none;transition:all var(--duration-fast)}
  #reply-input::placeholder{color:var(--text-quaternary)}
  #reply-input:focus{background:var(--bg-surface);box-shadow:var(--shadow-focus)}
  .btn-icon{background:none;border:none;padding:8px;border-radius:var(--radius-md);cursor:pointer;color:var(--text-quaternary);transition:all var(--duration-fast);display:flex}
  .btn-icon:hover{background:var(--bg-hover);color:var(--text-secondary)}
  .btn-send{width:44px;height:44px;background:var(--accent);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(108,92,231,0.2);transition:all var(--duration-fast);flex-shrink:0}
  .btn-send:hover{background:var(--accent-hover);transform:scale(1.05);box-shadow:0 4px 12px rgba(108,92,231,0.3)}
  .btn-send:active{transform:scale(0.95)}
  .btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}

  /* ── Customer panel ── */
  #customer-panel{width:210px;background:var(--bg-surface);box-shadow:-1px 0 0 0 rgba(0,0,0,0.06);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .panel-label{font-size:10px;font-weight:600;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:0.6px}
  .panel-field{margin-bottom:7px}.panel-fld-lbl{font-size:10px;color:var(--text-quaternary);margin-bottom:2px}.panel-fld-val{font-size:12px;color:var(--text-primary)}
  .panel-divider{border-top:1px solid rgba(0,0,0,0.05)}
  .pill-warn{padding:3px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:500;background:rgba(245,158,11,0.08);color:var(--warning)}
  .pill-online{display:inline-flex;align-items:center;gap:4px;color:var(--success);font-size:11px}
  .pill-online .dot{width:5px;height:5px;background:var(--success);border-radius:50%;box-shadow:0 0 4px rgba(16,185,129,0.4)}
  .btn-panel{width:100%;background:var(--text-primary);color:#fff;border:none;padding:9px;border-radius:var(--radius-md);font-size:11px;font-weight:500;font-family:var(--font-sans);cursor:pointer;transition:all var(--duration-fast)}
  .btn-panel:hover{background:#000}
  .btn-panel-ghost{width:100%;background:none;color:var(--text-tertiary);border:none;padding:9px;border-radius:var(--radius-md);font-size:11px;font-family:var(--font-sans);cursor:pointer;transition:all var(--duration-fast);box-shadow:var(--shadow-border)}
  .btn-panel-ghost:hover{background:var(--bg-hover);color:var(--text-secondary)}
  .timeline-item{display:flex;gap:8px}
  .timeline-line{width:2px;background:#e5e5e5;border-radius:1px;flex-shrink:0}
  .timeline-line.active{background:var(--accent)}
  .tl-title{font-size:11px;color:var(--text-primary)}.tl-time{font-size:10px;color:var(--text-quaternary);margin-top:1px}
  .tl-title.muted{color:var(--text-tertiary)}

  /* ═══════════════════════════════════════════════
     Mobile Responsive (< 768px)
     ═══════════════════════════════════════════════ */
  @media (max-width: 767px) {
    #app { flex-direction: column; }
    
    /* Desktop nav → hidden on mobile */
    #nav { display: none; }
    
    /* Sidebar becomes full-screen lead list */
    #sidebar {
      width: 100%; height: 100%;
      position: absolute; inset: 0; z-index: 10;
      transition: transform var(--duration-normal) var(--ease-out);
    }
    #sidebar.mobile-hidden { transform: translateX(-100%); }
    
    /* Main chat becomes full-screen */
    #main {
      position: absolute; inset: 0; z-index: 10;
      transition: transform var(--duration-normal) var(--ease-out);
    }
    #main.mobile-hidden { transform: translateX(100%); }
    
    /* Chat adjustments */
    #chat-header { padding: 10px 14px; min-height: 52px; }
    #chat-header .chat-avatar { width: 34px; height: 34px; border-radius: 9px; font-size: 14px; }
    #chat-header .chat-title { font-size: 14px; }
    #chat-header .chat-subtitle { font-size: 11px; }
    
    #messages-wrap { padding: 16px 14px; gap: 14px; }
    .msg-row { max-width: 85%; }
    .msg-bubble { padding: 10px 14px; font-size: 15px; }
    
    #reply-area { padding: 10px 12px 14px; }
    #reply-input { font-size: 15px; min-height: 42px; padding: 10px 14px; }
    .btn-send { width: 42px; height: 42px; border-radius: 10px; }
    
    /* Customer panel → hidden on mobile, slide up */
    #customer-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      width: 100%; max-height: 50vh; z-index: 20;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      transform: translateY(100%);
      transition: transform var(--duration-normal) var(--ease-out);
    }
    #customer-panel.mobile-show { transform: translateY(0); }
    #customer-panel .panel-close {
      display: flex;
      width: 32px; height: 4px;
      background: var(--text-disabled); border-radius: 2px;
      margin: 0 auto 12px;
    }
    
    /* Bottom nav */
    #mobile-nav {
      display: flex;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--bg-surface);
      box-shadow: 0 -1px 0 0 rgba(0,0,0,0.06);
      padding: 6px 0 env(safe-area-inset-bottom, 6px);
      justify-content: space-around;
    }
    .mnav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 12px; cursor: pointer;
      color: var(--text-quaternary);
      transition: color var(--duration-fast);
      min-width: 48px; min-height: 48px;
      justify-content: center;
    }
    .mnav-item.active { color: var(--accent); }
    .mnav-item span { font-size: 10px; font-weight: 500; }
    
    /* Chat header back button */
    .chat-back {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-md);
      cursor: pointer; color: var(--text-tertiary);
      margin-right: 8px; flex-shrink: 0;
      transition: all var(--duration-fast);
    }
    .chat-back:hover { background: var(--bg-hover); }
    
    /* Login mobile */
    #login-box { width: calc(100% - 48px); max-width: 380px; padding: 32px 24px; }
    #login-box h1 { font-size: 20px; }
    
    /* Mode switch smaller */
    .mode-switch { transform: scale(0.85); transform-origin: right center; }
    
    /* Hide desktop-only */
    .desktop-only { display: none !important; }
  }
  
  @media (min-width: 768px) {
    #mobile-nav { display: none; }
    .chat-back { display: none; }
    .panel-close { display: none; }
    .mobile-only { display: none !important; }
  }
</style>
</head>
<body>

<!-- ═══ LOGIN OVERLAY ═══ -->
<div id="login-overlay">
  <div id="login-box">
    <h1>SalesOS Lite</h1>
    <div class="login-sub">外贸 SME 统一收件箱</div>
    <input id="login-user" placeholder="邮箱" autofocus autocomplete="off">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">登录</button>
    <p id="login-error"></p>
    <div class="login-hint">测试: admin@test.com / admin123</div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" class="hidden">
  <nav id="nav">
    <div class="nav-brand">S</div>
    <div class="nav-icon active" title="收件箱">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 6 12 13 2 6"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
    </div>
    <div class="nav-icon" title="联系人">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
    </div>
    <div class="nav-icon" title="数据">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="12" height="8" rx="2"/></svg>
    </div>
    <div style="margin-top:auto;"></div>
    <div class="nav-logout" onclick="doLogout()" title="退出">退出</div>
  </nav>

  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>收件箱</h1>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="search-input" id="search-input" placeholder="搜索客户或消息" autocomplete="off" oninput="loadLeads()">
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all',this)">全部</button>
        <button class="filter-tab" onclick="setFilter('unread',this)">未读</button>
        <button class="filter-tab" onclick="setFilter('mine',this)">我的</button>
      </div>
    </div>
    <div id="lead-list"></div>
  </aside>

  <main id="main">
    <div id="chat-header">
      <div class="chat-header-left" id="chat-header-info">
        <div class="chat-back" onclick="showLeads()" title="返回列表">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div class="empty-state" style="font-size:13px;padding:0;flex:none">← 选择一个线索</div>
      </div>
      <div id="chat-header-right" class="hidden">
        <div class="mode-switch" id="mode-switch">
          <button class="mode-btn" onclick="setMode('manual',this)">人工</button>
          <button class="mode-btn active" onclick="setMode('assist',this)">AI 辅助</button>
          <button class="mode-btn" onclick="setMode('auto',this)">托管</button>
        </div>
      </div>
    </div>
    <div id="chat-body">
      <div id="messages-wrap">
        <div class="empty-state">← 选择一个线索开始对话</div>
      </div>
      <div id="customer-panel" class="hidden"></div>
    </div>
    <div id="reply-area" class="hidden">
      <div id="reply-row">
        <button class="btn-icon" id="btn-ai-suggest" title="AI 生成回复" onclick="aiSuggest()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </button>
        <textarea id="reply-input" placeholder="输入回复…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doReply()}"></textarea>
        <button class="btn-send" onclick="doReply()" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- ═══ Mobile Bottom Nav ═══ -->
  <nav id="mobile-nav">
    <div class="mnav-item active" onclick="showLeads()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 6 12 13 2 6"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
      <span>收件箱</span>
    </div>
    <div class="mnav-item" onclick="showChat()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>对话</span>
    </div>
    <div class="mnav-item" onclick="showCustomerPanel()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>客户</span>
    </div>
    <div class="mnav-item" onclick="doLogout()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>退出</span>
    </div>
  </nav>
</div>

<script>
// ═══════════════════════════════════════════
// State
// ═══════════════════════════════════════════
var _tk = '', _user = null, _leads = [], _activeId = null, _activeLead = null;
var _mode = 'assist'; // manual | assist | auto
var _filter = 'all';

// ═══════════════════════════════════════════
// API helpers
// ═══════════════════════════════════════════
async function api(path, opts) {
  opts = opts || {};
  var h = opts.headers || {};
  if (_tk) h['Authorization'] = 'Bearer ' + _tk;
  var r = await fetch(path, {headers:Object.assign({'Content-Type':'application/json'},h), ...opts});
  if (r.status === 401) { doLogout(); throw new Error('Unauthorized'); }
  return r;
}

function $(id) { return document.getElementById(id); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtTime(t) { if (!t) return ''; var d = new Date(t); return d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDate(t) { if (!t) return ''; var d = new Date(t); return d.toLocaleString('zh-CN',{month:'long',day:'numeric'}); }

// ═══════════════════════════════════════════
// Auth
// ═══════════════════════════════════════════
async function doLogin() {
  var u = $('login-user').value, p = $('login-pass').value;
  var r = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:u, password:p})
  });
  var d = await r.json();
  if (r.status !== 200) {
    $('login-error').textContent = (d.detail || '登录失败');
    $('login-error').style.display = 'block';
    return;
  }
  _tk = d.token;
  var me = await fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+_tk}});
  _user = await me.json();
  localStorage.setItem('salesos_lite_sess', JSON.stringify({tk:_tk}));
  $('login-overlay').classList.add('hidden');
  $('app').classList.remove('hidden');
  await loadLeads();
}

function doLogout() {
  localStorage.removeItem('salesos_lite_sess');
  location.reload();
}

async function tryRestore() {
  var s = localStorage.getItem('salesos_lite_sess');
  if (!s) return;
  var d = JSON.parse(s);
  if (!d.tk) return;
  var r = await fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+d.tk}});
  if (!r.ok) { localStorage.removeItem('salesos_lite_sess'); return; }
  _tk = d.tk; _user = await r.json();
  $('login-overlay').classList.add('hidden');
  $('app').classList.remove('hidden');
  await loadLeads();
}

// ═══════════════════════════════════════════
// Leads
// ═══════════════════════════════════════════
async function loadLeads() {
  var q = $('search-input').value || '';
  var params = new URLSearchParams();
  if (q) params.set('search', q);
  try {
    var r = await api('/api/inbox/leads?' + params);
    var data = await r.json();
    _leads = data.leads || data || [];
  } catch(e) { _leads = []; }
  renderLeadList();
}

function renderLeadList() {
  var el = $('lead-list'), html = '';
  if (!_leads.length) {
    html = '<div class="lead-empty">暂无线索<br><span style="font-size:11px">通过 Web Widget 或 API 接收消息</span></div>';
    el.innerHTML = html; return;
  }
  _leads.forEach(function(l) {
    var initials = (l.customer_name || '?').substring(0,2).toUpperCase();
    var ch = (l.source || 'web').toLowerCase();
    var chCls = ch === 'whatsapp' ? 'wa' : ch === 'email' ? 'em' : 'web';
    var chLabel = ch === 'whatsapp' ? 'WhatsApp' : ch === 'email' ? '邮件' : 'Web';
    var preview = (l.last_message || l.content || '暂无消息').substring(0,40);
    var active = l.id === _activeId ? ' active' : '';
    var time = l.updated_at || l.created_at || '';

    html += '<div class="lead-item'+active+'" onclick="selectLead(\''+l.id+'\')">';
    html += '<div class="lead-top">';
    html += '<div class="lead-avatar-group">';
    html += '<div class="lead-avatar '+chCls+'">'+esc(initials)+'</div>';
    html += '<div><div class="lead-name">'+esc(l.customer_name)+'</div>';
    html += '<div class="lead-channel-row">';
    if (ch === 'whatsapp') {
      html += '<svg class="channel-dot" viewBox="0 0 24 24" fill="#25D366"><path d="M17.5 6.5A8.4 8.4 0 0 0 12 4a8.5 8.5 0 0 0-8 8.5c0 1.4.4 2.8 1 4L3 22l5.7-1.9a8.4 8.4 0 0 0 3.3.7 8.5 8.5 0 0 0 8.5-8 8.2 8.2 0 0 0-3-6.3z"/><path d="M9.5 12.2 11 14l3.5-3.5" fill="none" stroke="#fff" stroke-width="1"/></svg>';
    } else if (ch === 'email') {
      html += '<svg class="channel-dot" viewBox="0 0 24 24" fill="none" stroke="#5B9CF5" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3 7 9 6 9-6"/></svg>';
    } else {
      html += '<svg class="channel-dot" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>';
    }
    html += '<span class="ch-label '+chCls+'">'+chLabel+'</span></div></div></div>';
    html += '<span class="lead-time">'+fmtTime(time)+'</span></div>';
    html += '<div class="lead-preview">'+esc(preview)+'</div></div>';
  });
  el.innerHTML = html;
}

async function selectLead(id) {
  _activeId = id;
  try {
    var r = await api('/api/inbox/leads/' + id);
    _activeLead = await r.json();
  } catch(e) { return; }
  renderChatHeader();
  renderMessages();
  renderCustomerPanel();
  renderLeadList();
  $('chat-header-right').classList.remove('hidden');
  $('#reply-area').classList.remove('hidden');
}

// ═══════════════════════════════════════════
// Chat
// ═══════════════════════════════════════════
function renderChatHeader() {
  var l = _activeLead; if (!l) return;
  var initials = (l.customer_name||'?').substring(0,2).toUpperCase();
  var ch = (l.source||'web').toLowerCase();
  var chLabel = ch === 'whatsapp' ? 'WhatsApp' : ch === 'email' ? '邮件' : 'Web';
  $('chat-header-info').innerHTML =
    '<div class="chat-avatar">'+esc(initials)+'</div>'+
    '<div><div class="chat-title">'+esc(l.customer_name)+'</div>'+
    '<div class="chat-subtitle">'+(l.customer_email||'')+' · '+chLabel+'</div></div>';
}

function renderMessages() {
  var l = _activeLead, wrap = $('messages-wrap');
  if (!l) { wrap.innerHTML = '<div class="empty-state">← 选择一个线索</div>'; return; }
  var msgs = l.messages || [];
  if (!msgs.length) {
    wrap.innerHTML = '<div class="empty-state">暂无消息</div>'; return;
  }
  var html = '';
  if (_mode !== 'manual') {
    var bannerText = _mode === 'assist' ? 'AI 辅助模式 · AI 会建议回复' : 'AI 托管模式 · AI 自动回复中';
    html += '<div class="mode-banner">'+bannerText+'</div>';
  }
  var lastDate = '';
  msgs.forEach(function(m) {
    var mDate = fmtDate(m.created_at);
    if (mDate && mDate !== lastDate) {
      html += '<div class="time-divider"><span>'+mDate+' · '+fmtTime(m.created_at)+'</span></div>';
      lastDate = mDate;
    }
    var dir = (m.sender === 'customer' || m.direction === 'in') ? 'in' : 'out';
    html += '<div class="msg-row '+dir+'"><div class="msg-bubble">'+esc(m.content)+'</div></div>';
  });
  wrap.innerHTML = html;
  wrap.scrollTop = wrap.scrollHeight;
}

async function doReply() {
  var inp = $('reply-input'), content = inp.value.trim();
  if (!content || !_activeId) return;
  inp.value = ''; inp.style.height = 'auto';
  try {
    await api('/api/inbox/leads/'+_activeId+'/reply', {
      method:'POST', body:JSON.stringify({content:content})
    });
  } catch(e) { return; }
  await selectLead(_activeId);
}

// ═══════════════════════════════════════════
// AI Mode
// ═══════════════════════════════════════════
function setMode(mode, btn) {
  _mode = mode;
  var btns = $('#mode-switch').querySelectorAll('.mode-btn');
  btns.forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var aiBtn = $('#btn-ai-suggest');
  if (mode === 'manual') { aiBtn.style.display = 'none'; }
  else { aiBtn.style.display = 'flex'; }
  var input = $('reply-input');
  if (mode === 'auto') { input.placeholder = 'AI 托管中，可随时输入接管…'; }
  else if (mode === 'assist') { input.placeholder = '输入回复，或点击 AI 生成建议…'; }
  else { input.placeholder = '输入回复…'; }
  renderMessages();
}

function aiSuggest() {
  var inp = $('reply-input');
  inp.value = '[AI 建议回复功能将在 M2 对接 AI Pipeline]';
  inp.focus();
}

// ═══════════════════════════════════════════
// Customer Panel
// ═══════════════════════════════════════════
function renderCustomerPanel() {
  var l = _activeLead;
  if (!l) { $('customer-panel').classList.add('hidden'); return; }
  $('customer-panel').classList.remove('hidden');
  var ch = (l.source||'web').toLowerCase();
  var statusLabel = (l.status === 'open' || !l.status) ? '待跟进' : l.status;
  var html = '';
  html += '<div class="panel-close mobile-only" onclick="hideCustomerPanel()"></div>';
  html += '<div><div class="panel-label">客户信息</div>';
  html += '<div class="panel-field"><div class="panel-fld-lbl">邮箱</div><div class="panel-fld-val">'+esc(l.customer_email||'—')+'</div></div>';
  html += '<div class="panel-field"><div class="panel-fld-lbl">渠道</div><div class="panel-fld-val">'+esc(ch)+'</div></div>';
  html += '<div class="panel-field"><div class="panel-fld-lbl">ID</div><div class="panel-fld-val" style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">'+esc((l.id||'').substring(0,8))+'</div></div>';
  html += '<span class="pill-online"><span class="dot"></span>活跃</span>';
  html += '</div><div class="panel-divider"></div>';
  html += '<div><div class="panel-label">线索</div>';
  html += '<span class="pill-warn">'+esc(statusLabel)+'</span>';
  html += '<div class="panel-field" style="margin-top:8px;"><div class="panel-fld-lbl">负责人</div><div class="panel-fld-val">'+esc(l.assignee_name||_user.username||'—')+'</div></div>';
  html += '</div><div class="panel-divider"></div>';
  html += '<button class="btn-panel">生成报价单</button>';
  html += '<button class="btn-panel-ghost">添加跟进</button>';
  $('customer-panel').innerHTML = html;
}

// ═══════════════════════════════════════════
// Filter
// ═══════════════════════════════════════════
function setFilter(f, btn) {
  _filter = f;
  var tabs = document.querySelectorAll('.filter-tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  loadLeads();
}

// ═══════════════════════════════════════════
// Mobile Navigation
// ═══════════════════════════════════════════
function showLeads() {
  var sidebar = $('sidebar'), main = $('main');
  sidebar.classList.remove('mobile-hidden');
  main.classList.add('mobile-hidden');
  updateMobileNav('leads');
}
function showChat() {
  var sidebar = $('sidebar'), main = $('main');
  sidebar.classList.add('mobile-hidden');
  main.classList.remove('mobile-hidden');
  updateMobileNav('chat');
}
function showCustomerPanel() {
  var panel = $('customer-panel');
  if (panel.classList.contains('mobile-show')) {
    hideCustomerPanel();
  } else {
    panel.classList.add('mobile-show');
  }
}
function hideCustomerPanel() {
  $('customer-panel').classList.remove('mobile-show');
}
function updateMobileNav(view) {
  document.querySelectorAll('.mnav-item').forEach(function(item, i) {
    item.classList.toggle('active', 
      (view === 'leads' && i === 0) || (view === 'chat' && i === 1));
  });
}

// Override selectLead for mobile: switch to chat view
var _origSelectLead = selectLead;
selectLead = async function(id) {
  await _origSelectLead(id);
  if (window.innerWidth < 768) showChat();
};

// ═══════════════════════════════════════════
// Init
// ═══════════════════════════════════════════
// On mobile, start with leads view
if (window.innerWidth < 768) { showLeads(); }
tryRestore();
</script>
</body>
</html>
